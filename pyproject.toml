[project]
name = "proteomics-rag"
version = "0.1.0"
description = "Domain-adapted RAG for proteomics literature and PTM datasets"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-huggingface>=0.1.0",
    "langchain-google-genai>=2.0.0",
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
    "duckdb>=1.0.0",
    "streamlit>=1.36.0",
    "rank-bm25>=0.2.2",
    "python-dotenv>=1.0.0",
    "pandas>=2.2.0",
    "pyarrow>=16.0.0",
    "torch>=2.3.0",
    "transformers>=4.44.0",
    "pypdf>=4.0.0",
    "openpyxl>=3.1.0",
    "pubmed-parser>=0.5.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "pre-commit>=3.7.0",
    "ipykernel>=6.29.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
